name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Новий push у ту саму гілку скасовує попередній прогін
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Лінт та синтаксис Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Версія зафіксована, щоб оновлення ruff не ламало CI несподівано
      - name: Встановити ruff
        run: pip install ruff==0.16.5

      - name: ruff check
        run: ruff check api bot

      - name: Перевірка синтаксису
        run: python -m compileall -q api/src bot/src

  imports:
    name: Імпорт застосунків
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # api і bot тягнуть різні набори залежностей, тож ставимо в окремі venv
      - name: Імпорт FastAPI-застосунку
        working-directory: api
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/test
          BOT_TOKEN: "123456:test-token-for-ci"
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
          # Імпорт піднімає роутери і схеми, але не чіпає БД (connect_db у lifespan)
          .venv/bin/python -c "from src.main import app; print(f'{len(app.routes)} маршрутів')"

      - name: Імпорт бота
        working-directory: bot
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/test
          BOT_TOKEN: "123456:test-token-for-ci"
          MINI_APP_URL: https://example.com
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
          .venv/bin/python -c "from src.main import main; from src.handlers.start import router; print('бот імпортується')"

  infra:
    name: Конфіги інфраструктури
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Обидва compose-файли мають env_file: .env — без нього config впаде
      - name: Підготувати .env
        run: cp .env.example .env

      - name: Валідність compose-файлів
        run: |
          docker compose -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.yml config -q

      - name: Синтаксис nginx.conf
        run: |
          docker run --rm \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

  frontend:
    name: Фронтенд — типи та збірка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Встановити залежності
        run: npm ci

      # tsc окремим кроком від vite build: так у логах видно, що саме впало —
      # типи чи сама збірка. npm run build робить обидва разом.
      - name: Перевірка типів
        run: npx tsc --noEmit

      - name: Збірка
        run: npx vite build

  build:
    name: Збірка образів
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./api
            dockerfile: ./api/Dockerfile
          - name: bot
            context: ./bot
            dockerfile: ./bot/Dockerfile
          # У nginx контекст — корінь проєкту: його перша стадія збирає
          # фронтенд, тож їй потрібні і frontend/, і nginx/.
          - name: nginx
            context: .
            dockerfile: ./nginx/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Зібрати ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets:
    name: Перевірка на секрети
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: .env не має бути у git
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env потрапив у репозиторій — відкличте BOT_TOKEN і приберіть файл з історії"
            exit 1
          fi
          echo "OK: .env не відстежується"

      - name: Пошук токенів Telegram у відстежуваних файлах
        run: |
          # Формат токена BotFather: <digits>:<35 символів>. Плейсхолдери в
          # .env.example і CI навмисно коротші й під шаблон не підпадають.
          if git grep -nE '[0-9]{8,10}:[A-Za-z0-9_-]{35}' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Схоже на справжній BOT_TOKEN у репозиторії"
            exit 1
          fi
          echo "OK: токенів не знайдено"

      - name: Пошук підписаного initData
        run: |
          # initData підписаний тим самим BOT_TOKEN і дійсний добу. Одного разу
          # він уже витікав через dev-сервер, тож стежимо і за ним. Шукаємо
          # зв'язку auth_date + hash, а не окремі слова: інакше спрацьовуватиме
          # на код, який ці поля просто називає.
          # Статус пайплайна тут не показник: xargs без вводу завершується
          # нулем, тож `if ... | xargs ...` спрацьовував би на порожньому
          # результаті. Дивимось саме на вивід.
          found=$(git grep -lE 'auth_date=[0-9]{10}' -- . ':!.github/workflows/ci.yml' \
                  | xargs -r grep -lE 'hash=[a-f0-9]{64}' || true)
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::Схоже на підписаний initData у репозиторії — перегенеруйте його"
            exit 1
          fi
          echo "OK: initData не знайдено"
