# Оточення для локальної розробки.
#     docker compose -f docker-compose.dev.yml up        # redis + api + bot
#     docker compose -f docker-compose.dev.yml --profile frontend up   # + Vite
#
# Postgres тут не піднімається — використовується зовнішній сервер із .env.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # DATABASE_URL береться з .env (зовнішній сервер з postgres/pgadmin)
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8010:8000"   # 8000 на хості зайнятий portainer
    volumes:
      - ./api/src:/app/src   # hot-reload: правки коду одразу підхоплюються
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    # DATABASE_URL береться з .env (зовнішній сервер з postgres/pgadmin)
    volumes:
      - ./bot/src:/app/src

  # Фронтенд ще не заскафолджений (немає package.json / Dockerfile.dev),
  # тож сервіс сховано за профілем — інакше падав би весь `compose up`.
  # Вмикається так: docker compose -f docker-compose.dev.yml --profile frontend up
  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0