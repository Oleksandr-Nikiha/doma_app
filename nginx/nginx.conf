# Server-block для Mini App: статика зібраного React + проксі /api у FastAPI.
# Копіюється у /etc/nginx/conf.d/default.conf (див. nginx/Dockerfile).
#
# TLS тут свідомо не термінується: локально HTTPS дає Cloudflare Tunnel / ngrok,
# у проді — зовнішній reverse-proxy або certbot. Приклад HTTPS-блоку — в кінці файлу.

server {
    listen 80;
    server_name _;

    # Вбудований DNS Docker. Потрібен, бо адресу api резолвимо в рантаймі,
    # а не один раз на старті — інакше nginx падає, якщо api ще не піднявся,
    # і тримає стару IP після рестарту контейнера api.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Telegram відкриває Mini App у WebView, а на Desktop — в iframe.
    # Тому X-Frame-Options: DENY тут ставити НЕ можна — застосунок не завантажиться.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 2m;

    location /api/ {
        # Хост у змінній — саме це вмикає рантайм-резолв через resolver вище.
        # Через змінну nginx не підставляє URI сам, тож додаємо $request_uri явно.
        set $api_upstream "http://api:8000";
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # initData — кастомний заголовок, проксі має пропускати його без змін
        proxy_pass_request_headers on;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Хешовані ассети Vite (app.a1b2c3d4.js) — незмінні, кешуємо надовго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кешуємо: інакше після деплою користувач тягне старі ассети
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA-fallback: усі невідомі шляхи віддаємо роутеру на клієнті
    location / {
        try_files $uri $uri/ /index.html;
    }
}

